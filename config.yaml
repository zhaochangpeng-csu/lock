system:
  dry_run: false
  log_level: INFO
  cooldown_seconds: 5.0
  max_attempt_seconds: 12.0
  # Keep a passed face/liveness/speaker state visible/usable for this long.
  result_hold_seconds: 5.0

camera:
  index: 0
  width: 640
  height: 480
  warmup_frames: 5
  mock_when_unavailable_in_dry_run: true

sensor:
  # Options: serial_infrared, gpio_infrared, mock
  type: serial_infrared
  pin: 7
  active_high: true
  poll_interval_seconds: 0.1
  mock_trigger_interval_seconds: 8.0
  # Once the infrared reports a person, keep the latched presence state for
  # this many seconds. This avoids flapping when the sensor is slow or drops
  # out briefly, and prevents repeated "person detected" voice prompts.
  presence_hold_seconds: 30.0
  serial:
    port_candidates:
      - "/dev/ttyUSB0"
      - "/dev/ttyUSB1"
      - "COM3"
    baudrate: 9600
    timeout_seconds: 0.5
    # Original code: bytes.fromhex(body_command), ser.write(cmd), ser.read(7).
    # If your old config.ini has body_command, paste that exact hex string here.
    command_hex: "02 03 00 04 00 01 C5 F8"
    response_bytes: 7
    value_hex_start: 6
    value_hex_end: 10
    detected_value: 1

lock:
  relay_pin: 11
  active_high: true
  unlock_seconds: 2.0
  # relay = GPIO relay; fan_serial = Modbus serial fan used to simulate unlocking.
  actuator: fan_serial
  # immediate: preserve the original hardware flow.
  # agent_confirm: fusion issues a short-lived credential; voice Agent requests unlock.
  flow: agent_confirm

face:
  enabled: true
  backend: insightface
  min_score: 0.65
  accept_any_detected_face_in_dry_run: true
  accept_mock_frame_in_dry_run: true
  haar_scale_factor: 1.1
  haar_min_neighbors: 5
  min_face_size: 80
  data_dir: "database/faces"
  model_path: "models/lbph_face.yml"
  labels_path: "models/face_labels.json"
  width: 160
  height: 160
  lbph_confidence_max: 90.0
  insightface_model: "buffalo_sc"
  insightface_root: "models/insightface"
  insightface_det_size:
    - 640
    - 640
  insightface_ctx_id: -1
  embedding_dir: "database/face_embeddings"

liveness:
  enabled: true
  backend: mediapipe
  min_score: 0.6
  pass_in_dry_run: true
  duration_seconds: 5.0
  min_motion_ratio: 0.06
  mediapipe_model_path: "models/mediapipe/face_landmarker.task"
  min_blink_ear_drop: 0.03
  min_head_yaw_motion: 0.045
  # Minimum valid landmark frames required for scoring.
  min_landmark_frames: 3
  # MediaPipe detection/tracking thresholds; lower values detect smaller/blurrier faces.
  mediapipe_min_face_detection_confidence: 0.4
  mediapipe_min_face_presence_confidence: 0.4
  mediapipe_min_tracking_confidence: 0.4

speaker:
  enabled: true
  backend: speechbrain_ecapa
  min_score: 0.7
  min_speech_seconds: 2.0
  pass_in_dry_run: true
  voice_dir: "database/voices"
  # None means use PulseAudio default source (Jetson verified path).
  input_device: null
  sample_rate: 16000
  record_seconds: 2.5
  n_mfcc: 13
  min_voice_samples: 1
  speechbrain_source: "speechbrain/spkrec-ecapa-voxceleb"
  speechbrain_savedir: "models/speechbrain/spkrec-ecapa-voxceleb"

auto_auth:
  enabled: true
  cooldown_seconds: 8.0
  # Delay before retrying after a failed authentication attempt.
  failed_retry_seconds: 2.0
  # Person must be absent this long before automatic auth may run again.
  absence_rearm_seconds: 5.0
  require_sensor: true
  require_face: true
  presence_voice_cooldown_seconds: 6.0
  auto_start_delay_ms: 200
  camera_triggered_by_sensor: true
  camera_idle_close_seconds: 10.0

voice_feedback:
  enabled: true
  backend: aplay_pcm
  pcm_dir: "audio_prompts"
  pcm_device: "plughw:Device"
  pcm_rate: 16000
  pcm_format: "S16_LE"
  pcm_channels: 1
  cooldown_seconds: 1.2
  block: false
  fallback_to_tts_command: true
  # Natural Chinese voice used when a prompt PCM file is missing.
  sherpa_model_dir: "models/tts/vits-piper-zh_CN-xiao_ya-medium-int8"
  sherpa_num_threads: 2
  sherpa_speed: 1.0
  messages:
    app_started: "智能门锁已启动"
    presence: "检测到有人靠近，请正对摄像头"
    auto_start: "检测到红外和人脸，开始自动认证"
    face_pass: "人脸识别通过"
    face_fail: "人脸识别失败，请正对摄像头"
    liveness_prompt: "请眨眼一次，并左右转头"
    liveness_pass: "活体检测通过"
    liveness_fail: "活体检测失败，请重新眨眼并转头"
    voice_prompt: "请自然说话，完成声纹识别"
    voice_pass: "声纹识别通过"
    voice_fail: "声纹识别失败，请重新自然说一句话"
    auth_pass: "认证通过，欢迎回家"
    auth_fail: "认证失败，请重试"

fusion:
  threshold: 0.78
  # false = weighted score only; true = every check must also pass.
  require_all: false
  weights:
    face: 0.45
    liveness: 0.25
    speaker: 0.20
    sensor: 0.10
agent:
  system_prompt: >-
    You are a smart-lock voice agent at a door. Always answer in one short Chinese sentence.
    No greetings, no explanations, no extra suggestions.
    Before any unlock request, call current_auth_context.
    Only call request_unlock(reason) when the context is available, fresh, authorized, and unconsumed.
    If request_unlock returns allowed=true, say "已为您开门".
    If request_unlock returns allowed=false, say "开锁未成功，请稍后重试".
    Never mention tokens, URLs, thresholds, or internal details.
  fastgpt:
    api_base: "http://127.0.0.1:3300"
    api_base_env: "FASTGPT_API_BASE"
    app_api_key_env: "FASTGPT_APP_API_KEY"
    app_id_env: "FASTGPT_APP_ID"
    timeout_seconds: 30.0
    # Local/LAN FastGPT must not be routed through Windows/WSL HTTP_PROXY.
    trust_env_proxy: false
  tool_gateway:
    host: "0.0.0.0"
    port: 8787
    host_env: "LOCK_TOOL_GATEWAY_HOST"
    port_env: "LOCK_TOOL_GATEWAY_PORT"
    token_env: "LOCK_TOOL_TOKEN"
    call_log_path: "logs/tool_gateway_calls.jsonl"
    call_log_path_env: "LOCK_TOOL_CALL_LOG"
    expose_to_lan: true
  asr:
    backend: funasr
    model: "iic/SenseVoiceSmall"
    vad_model: "fsmn-vad"
    download_root: "models/funasr"
    device: "cpu"
    record_seconds: 2.5
  tts:
    backend: edge_tts
    voice: "zh-CN-XiaoxiaoNeural"
    # Local offline fallback used when EdgeTTS is unreachable.
    sherpa_model_dir: "models/tts/vits-piper-zh_CN-xiao_ya-medium-int8"
    sherpa_num_threads: 2
    sherpa_speed: 1.0
  safety:
    auth_context_max_age_seconds: 300.0
    auth_context_path: "logs/auth_context.json"
    auth_context_path_env: "LOCK_AUTH_CONTEXT_PATH"
