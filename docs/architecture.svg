  <text x="195" y="448" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">提示词 · 工作流 · 工具编排</text>
</g>
<g>
  <rect x="350" y="410" width="270" height="52" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="485" y="430" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">DeepSeek API</text>
  <text x="485" y="448" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">deepseek-v4-flash 推理</text>
</g>

<text x="40" y="514" font-size="12" fill="#5F5E5A">数据流:麦克风 → ASR → Pipecat → FastGPT(DeepSeek)→ 工具网关 → safety gate → 开锁 / TTS</text>
</svg>
