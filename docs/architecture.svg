<svg viewBox="0 0 680 532" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>智能门锁 Agent 部署架构</title>
<desc>Jetson Nano 本地与电脑/云服务器 FastGPT 的分工架构,含 HTTP 工具调用链路</desc>
