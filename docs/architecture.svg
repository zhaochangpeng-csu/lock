  </marker>
</defs>
<text x="40" y="24" font-size="14" font-weight="500" fill="#2C2C2A">智能门锁 Agent 部署架构(Jetson + FastGPT)</text>
<text x="640" y="24" text-anchor="end" font-size="12" fill="#5F5E5A">虚线 = 规划中</text>

<rect x="40" y="40" width="600" height="280" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="62" font-size="14" font-weight="500" fill="#042C53">Jetson Nano 本地(硬件 · 识别 · 语音 · 安全执行)</text>

