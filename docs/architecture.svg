<line x1="308" y1="376" x2="308" y2="328" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="372" y1="320" x2="372" y2="368" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="350" text-anchor="middle" font-size="12" fill="#444441">HTTP 工具调用 · Bearer ${LOCK_TOOL_TOKEN}</text>

<rect x="40" y="376" width="600" height="112" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="398" font-size="14" font-weight="500" fill="#26215C">电脑 / 云服务器(Agent 大脑)</text>
